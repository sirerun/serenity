name: Website
on:
  push:
    branches: [main]
    paths: ['web/inspector/**', 'site/**', 'scripts/site/**', 'deploy/chat/**', 'tests/site/**', 'playwright.config.js', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/inspector/**', 'site/**', 'scripts/site/**', 'deploy/chat/**', 'tests/site/**', 'playwright.config.js', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir "$RUNNER_TEMP/mkdocs-site"
      - run: python3 scripts/site/check.py
      - run: python3 -m unittest discover -s tests/site -p 'test_*.py' -v
      - run: python3 -m unittest discover -s deploy/chat -p 'test_*.py' -v
      - run: node --check site/assets/chat.js && node --check site/assets/site.js && node --check site/assets/adoption.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - name: Verify inspector source and embedded assets
        working-directory: web/inspector
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../../site/explore ../../site/assets/explorer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - name: Require executed browser coverage
        run: node tests/site/check-results.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: site-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy static files
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
