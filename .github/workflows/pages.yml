name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site/**', 'deploy/chat/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/site/**', 'deploy/chat/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir "$RUNNER_TEMP/mkdocs-site"
      - run: python3 scripts/site/check.py
      - run: python3 -m unittest discover -s deploy/chat -p 'test_*.py' -v
      - run: node --check site/assets/chat.js && node --check site/assets/site.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy static files
        id: deployment
        uses: actions/deploy-pages@v4
