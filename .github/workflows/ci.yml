name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -timeout 600s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4

  dira-vendor-pin:
    # T3.1: internal/dira/ must stay byte-identical to kazi-org/dira at the
    # commit internal/dira/PIN records (no fork-and-edit, ADR 008). Separate
    # from `test` because it needs network access to the real upstream repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: internal/dira/verify-pin.sh

  dira-cli-conformance:
    # T3.14: the real kazi-org/dira binary, installed unmodified at the pin in
    # internal/dira/PIN, must still run `check`/`why`/`brief` against a fixture
    # ledger the way this repo depends on. Separate from `test` because it
    # needs network access to install the pinned upstream binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify-dira-cli.sh

  crossbuild:
    # M0 acceptance: single binary on macOS arm64 + Linux amd64/arm64.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/serenity
