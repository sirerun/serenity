name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -timeout 600s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4

  dira-vendor-pin:
    # T3.1: internal/dira/ must stay byte-identical to kazi-org/dira at the
    # commit internal/dira/PIN records (no fork-and-edit, ADR 008). Separate
    # from `test` because it needs network access to the real upstream repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: internal/dira/verify-pin.sh

  dira-cli-conformance:
    # T3.14: the real kazi-org/dira binary, installed unmodified at the pin in
    # internal/dira/PIN, must still run `check`/`why`/`brief` against a fixture
    # ledger the way this repo depends on. Separate from `test` because it
    # needs network access to install the pinned upstream binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify-dira-cli.sh

  gbrain-protocol-conformance:
    # T4.14: gbrain's own `protocol conformance` certifier
    # (github.com/dndungu/gbrain, pinned d35c9c9e441e6cfc86dd5e84b0b168c6b18ee775
    # -- docs/protocol/MEMORY_VERBS_v1.md) against a live
    # `serenity serve --http` /mcp endpoint on a throwaway fixture brain.
    # internal/cli's TestGbrainProtocolConformance drives serve --http
    # in-process (see that test's own doc comment for why -- no dbus/
    # gnome-keyring setup here) and execs gbrain's real TypeScript SDK
    # client as the only genuine subprocess. Separate from `test` because
    # it needs network access (cloning gbrain, `bun install`), the same
    # convention dira-vendor-pin/dira-cli-conformance already use for their
    # own external-tool checks. Runs unconditionally on every push/PR like
    # every other job here (no path-filtering); making it a GitHub branch
    # protection "required status check" is a separate repo-settings change
    # this job's own YAML cannot express -- see docs/plan.md T4.14.
    runs-on: ubuntu-latest
    env:
      GBRAIN_PIN: d35c9c9e441e6cfc86dd5e84b0b168c6b18ee775
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Checkout dndungu/gbrain @ pin
        run: |
          git init -q "$RUNNER_TEMP/gbrain"
          git -C "$RUNNER_TEMP/gbrain" fetch -q --depth 1 https://github.com/dndungu/gbrain.git "$GBRAIN_PIN"
          git -C "$RUNNER_TEMP/gbrain" checkout -q FETCH_HEAD
      - run: bun install --frozen-lockfile
        working-directory: ${{ runner.temp }}/gbrain
      - name: gbrain protocol conformance against serenity serve --http
        env:
          SERENITY_GBRAIN_CONFORMANCE: "1"
          GBRAIN_CLI_DIR: ${{ runner.temp }}/gbrain
        run: go test -race -timeout 120s -run ^TestGbrainProtocolConformance$ -v ./internal/cli/...

  eval-cached:
    # T1.22: per-push cached eval gate. Scores a frozen fixture
    # (evals/fixtures/ava-cached-predictions.yaml) against the T1.14 Ava
    # corpus's held-out split through the real report-generation code
    # path (cmd/eval-runner -mode cached, internal/eval/runner) -- zero
    # network calls, so it stays fast and free on every push. It catches
    # a regression in the scoring/report pipeline itself, not in
    # extraction quality: real live-model measurement runs nightly
    # instead (nightly-eval.yml) since that needs real API calls and a
    # budget.
    #
    # T3.16 extends the same job with the DIRECTION corpus (T3.13) and its
    # own cached fixture (evals/fixtures/direction-cached-predictions.yaml)
    # rather than adding a second job: same zero-network-call cached-mode
    # property, same report.json output, one gate.
    #
    # T2.18 extends it again with the reconcile corpus (evals/corpora/
    # reconcile): no fixture flag needed, since internal/reconcile.Detect
    # is a pure function scored directly, not a cached model prediction.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/eval-runner -mode cached -corpus evals/corpora/ava -fixture evals/fixtures/ava-cached-predictions.yaml -direction-corpus evals/corpora/direction -direction-fixture evals/fixtures/direction-cached-predictions.yaml -reconcile-corpus evals/corpora/reconcile -out "$RUNNER_TEMP/report.json"
      - run: cat "$RUNNER_TEMP/report.json"

  brainbench-trend:
    # T1.21: runs the vendored dndungu/gbrain BrainBench fixtures
    # (evals/brainbench/, pinned in evals/brainbench/PIN) through
    # Serenity's real hybrid search (internal/search, T1.11 -- FTS-only,
    # zero live model calls) and uploads evals/brainbench-trend.json as
    # this run's score row. No network access needed: the corpus is
    # vendored, not fetched. T5.10 persists these rows into an actual
    # trend across runs and renders the chart into the docs site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run evals/brainbench/gen_trend.go
      - uses: actions/upload-artifact@v4
        with:
          name: brainbench-trend
          path: evals/brainbench-trend.json

  crossbuild:
    # M0 acceptance: single binary on macOS arm64 + Linux amd64/arm64.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/serenity

  install-verify:
    # T5.7: scripts/install-verify.sh drives a fresh clone through the
    # full documented walkthrough (init -> connect a connector -> sync ->
    # extract -> search -> ask -> inbox -> check) against the canned Ava
    # corpus (T1.14) on a clean runner, timed under the acc line's 15 min
    # budget. `timeout-minutes` is a hard backstop; the script enforces
    # its own budget too so a slow step fails loudly with a real reason
    # instead of a bare CI timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/install-verify.sh
