name: release

on:
  push:
    tags: ["v*"]

# Least privilege (deep review 001 SUP-02): every job gets a read-only token
# unless it declares more. Only the publish job below may write.
permissions:
  contents: read

jobs:
  adversarial-gate:
    # T5.5: the release cannot proceed unless the pinned adversarial corpus
    # proves that untrusted documents cannot mutate .dira/ or mint effects.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./internal/gate
      - name: Seeded vulnerable build must fail the gate
        shell: bash
        run: |
          seed_log=$(mktemp)
          trap 'rm -f "$seed_log"' EXIT
          set +e
          SERENITY_ADVERSARIAL_VULNERABLE=1 go test -count=1 ./internal/gate >"$seed_log" 2>&1
          status=$?
          set -e
          cat "$seed_log"
          if [ $status -eq 0 ]; then
            echo "seeded vulnerable build unexpectedly passed the adversarial gate"
            exit 1
          fi
          if ! grep -Fq "unsafe subject escaped model boundary" "$seed_log"; then
            echo "seeded vulnerable run failed without reproducing the subject traversal"
            exit 1
          fi

  goreleaser:
    needs: adversarial-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless Sigstore signatures
      attestations: write # GitHub provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install Syft
        run: |
          install -d "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/anchore/syft/cmd/syft@v1.52.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact pin so a release tag always builds with the same goreleaser
          # (deep review 001 SUP-01); bump deliberately, never float.
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Brew tap publishing needs a PAT with repo scope on sirerun/homebrew-tap:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
