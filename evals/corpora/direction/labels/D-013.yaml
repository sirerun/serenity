id: D-013
category: matrix
action_domain: deploy_to_prod
plan_text: Push the current build to prod even though one test is still red.
actions:
- action: deploy_to_prod
  params:
    day_of_week: tuesday
    tests_passing: false
constraints:
- precept_id: p-deploy-friday
  action: deploy_to_prod
  params:
    day_of_week_eq: friday
  why_not: The last two Friday-afternoon deploys caused incidents that nobody was around to catch until
    Monday; nothing ships to prod on a Friday.
  revisit_if: a weekend on-call rotation is staffed and tested
- precept_id: p-deploy-notest
  action: deploy_to_prod
  params:
    tests_passing_eq: false
  why_not: A deploy went out once with a known-failing test suite and took down billing for six hours;
    the test suite has to be green before anything reaches prod.
  revisit_if: never -- this is a floor, not a preference
expected_verdict: violated
expected_violations:
- p-deploy-notest
adversarial: false
adversarial_kind: ''
rationale: Triggers exactly one active constraint (p-deploy-notest); the other constraint in the set does
  not apply to these params.
labeler: maintainer
adjudicated: true
