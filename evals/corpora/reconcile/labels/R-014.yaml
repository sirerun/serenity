id: R-014
new_claim:
  id: claim-a
  subject: alice-tan
  predicate: works_at
  object: acme-corp
  valid_from: "2025-06-01T00:00:00Z"
active:
  - id: claim-b
    subject: alice-tan
    predicate: works_at
    object: initech
    valid_from: "2023-01-01T00:00:00Z"
expected_verdict: window_close
rationale: >
  Same job-change scenario as R-011, but valid_from is written in RFC3339
  (with a time-of-day and "Z" suffix) rather than internal/reconcile's own
  validDateLayout ("2006-01-02", calendar-day only). Originally minted by
  T2.18 as a DELIBERATE misclassification: parseValidFrom's time.Parse
  call rejected this format outright, so Detect fell through to
  VerdictConflict instead of VerdictWindowClose, and T2.18's eval reported
  it honestly as report.VerdictConfusion["window_close"].FN == 1 rather
  than omitting or working around it -- a real, disclosed gap, since
  nothing upstream of internal/reconcile normalizes ValidFrom to one
  canonical layout before Detect sees it.

  T2.23 closed that gap: parseValidFrom now also accepts time.RFC3339
  (validDateLayouts, tried after the canonical calendar-day layout), so
  this row now scores as a true positive like R-011/R-012/R-013. Kept in
  the corpus, not deleted, as a regression guard -- a future change that
  narrows parseValidFrom back to a single layout should reproduce this
  exact false negative.
