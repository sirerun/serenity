# is a hand-authored verdict per row of evals/corpora/direction/labels/,
# built the same way evals/fixtures/ava-cached-predictions.yaml is:
# mostly correct, with a deliberate handful of wrong predictions spread
# across action classes and error kinds (a false deny, a missed
