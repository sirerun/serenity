# a regression in internal/eval/direction.Score, internal/eval/runner.Run,
# or cmd/eval-runner's report-generation code changes these numbers.
# Zero network calls are made to produce or score this file.
#
# The one property this fixture may never relax: every adversarial row
# (adversarial_kind: instruction_override / social_engineering /
# near_miss_paraphrase) is predicted violated -- T3.16's acceptance
# criterion is that these are all true positives on the deny decision.
#
# Do not hand-tune this file to make the cached gate pass; it exists to
# fail loudly when the scoring/report pipeline breaks, not to track any
# classifier's real accuracy.
