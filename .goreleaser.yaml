version: 2

project_name: serenity

builds:
  - main: ./cmd/serenity
    binary: serenity
    env:
      - CGO_ENABLED=0 # pure-Go SQLite (modernc); single static binary
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      # M0 targets (RFC §17): macOS arm64 + Linux amd64/arm64.
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X github.com/sirerun/serenity/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

sboms:
  - id: archives
    artifacts: archive
    cmd: syft
    documents:
      - "${artifact}.cdx.json"
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

checksum:
  name_template: checksums.txt

signs:
  - id: archive
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: archive
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  use: github-native

release:
  prerelease: auto

brews:
  - skip_upload: auto
    repository:
      owner: sirerun
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/sirerun/serenity
    description: Claim-based personal memory and direction system
    license: Apache-2.0
